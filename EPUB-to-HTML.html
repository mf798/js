<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EPUB → Single HTML Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- JSZip from CDN (for EPUB/ZIP handling) -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      max-width: 900px;
      margin-inline: auto;
    }
    header {
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      margin: 0 0 0.5rem;
    }
    label, button {
      font-size: 1rem;
    }
    input[type="file"] {
      max-width: 100%;
    }
    button {
      padding: 0.5rem 1rem;
      margin-top: 0.75rem;
      cursor: pointer;
    }
    #status {
      margin-top: 0.75rem;
      font-size: 0.95rem;
    }
    #preview {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
      max-height: 50vh;
      overflow: auto;
    }
    #preview h2 {
      margin-top: 0;
      font-size: 1.1rem;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>EPUB → Single HTML Converter</h1>
    <p>Select an EPUB file. It will be converted into a single self-contained HTML file with inlined CSS and images.</p>
    <label for="epubInput"><strong>EPUB file:</strong></label>
    <br />
    <input type="file" id="epubInput" accept=".epub" />
    <br />
    <button id="convertBtn">Convert to HTML</button>
    <div id="status"></div>
  </header>

  <section id="preview" hidden>
    <h2>Quick preview (first part of generated HTML)</h2>
    <pre id="previewContent" style="white-space: pre-wrap; font-size: 0.85rem;"></pre>
  </section>

  <script>
    const epubInput = document.getElementById("epubInput");
    const convertBtn = document.getElementById("convertBtn");
    const statusEl = document.getElementById("status");
    const previewSection = document.getElementById("preview");
    const previewContent = document.getElementById("previewContent");

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? "crimson" : "inherit";
    }

    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
      });
    }

    async function loadEpubZip(file) {
      const buffer = await readFileAsArrayBuffer(file);
      return JSZip.loadAsync(buffer);
    }

    async function getTextFile(zip, path) {
      const file = zip.file(path);
      if (!file) throw new Error("Missing file in EPUB: " + path);
      return file.async("string");
    }

    function dirname(path) {
      const idx = path.lastIndexOf("/");
      return idx === -1 ? "" : path.slice(0, idx + 1);
    }

    function joinPath(base, rel) {
      if (!base) return rel;
      if (rel.startsWith("/")) return rel.slice(1);
      const stack = base.split("/").filter(Boolean);
      const parts = rel.split("/");
      for (const part of parts) {
        if (part === "." || part === "") continue;
        if (part === "..") stack.pop();
        else stack.push(part);
      }
      return stack.join("/");
    }

    async function parseContainer(zip) {
      const containerXml = await getTextFile(zip, "META-INF/container.xml");
      const parser = new DOMParser();
      const doc = parser.parseFromString(containerXml, "application/xml");
      const rootfile = doc.querySelector("rootfile");
      if (!rootfile) throw new Error("No rootfile found in container.xml");
      return rootfile.getAttribute("full-path");
    }

    async function parsePackage(zip, opfPath) {
      const opfText = await getTextFile(zip, opfPath);
      const parser = new DOMParser();
      const doc = parser.parseFromString(opfText, "application/xml");

      const manifest = new Map();
      doc.querySelectorAll("manifest > item").forEach(item => {
        manifest.set(item.getAttribute("id"), {
          id: item.getAttribute("id"),
          href: item.getAttribute("href"),
          mediaType: item.getAttribute("media-type")
        });
      });

      const spineIds = [];
      doc.querySelectorAll("spine > itemref").forEach(itemref => {
        const idref = itemref.getAttribute("idref");
        if (idref && manifest.has(idref)) spineIds.push(idref);
      });

      return { manifest, spineIds, opfDir: dirname(opfPath) };
    }

    async function buildResourceMaps(zip, manifest, opfDir) {
      const cssTexts = [];
      const imageMap = new Map(); // path -> data URL

      for (const item of manifest.values()) {
        const fullPath = joinPath(opfDir, item.href);
        if (item.mediaType === "text/css") {
          const css = await getTextFile(zip, fullPath);
          cssTexts.push("/* " + item.href + " */\n" + css + "\n");
        } else if (item.mediaType.startsWith("image/")) {
          const file = zip.file(fullPath);
          if (!file) continue;
          const base64 = await file.async("base64");
          const dataUrl = `data:${item.mediaType};base64,${base64}`;
          imageMap.set(fullPath, dataUrl);
        }
      }

      return { cssTexts, imageMap };
    }

    function rewriteDocumentLinksAndIds(doc, fileKey) {
      // Prefix IDs to keep them unique across merged documents
      const idElements = doc.querySelectorAll("[id]");
      idElements.forEach(el => {
        const oldId = el.getAttribute("id");
        const newId = fileKey + "__" + oldId;
        el.setAttribute("id", newId);
      });

      // Rewrite internal hyperlinks
      const anchors = doc.querySelectorAll("a[href]");
      anchors.forEach(a => {
        const href = a.getAttribute("href");
        if (!href || href.startsWith("http:") || href.startsWith("https:") || href.startsWith("mailto:")) {
          return;
        }

        let filePart = "";
        let fragPart = "";
        if (href.includes("#")) {
          [filePart, fragPart] = href.split("#");
        } else {
          filePart = href;
        }

        if (!filePart && fragPart) {
          // Same document anchor
          a.setAttribute("href", "#" + fileKey + "__" + fragPart);
        } else if (filePart && fragPart) {
          const otherKey = filePart.replace(/\\/g, "/").split("/").pop().replace(/\.[^.]+$/, "");
          a.setAttribute("href", "#" + otherKey + "__" + fragPart);
        } else if (filePart && !fragPart) {
          // Link to another file without fragment – keep as-is (best effort)
          a.setAttribute("href", "#");
        }
      });
    }

    function rewriteImages(doc, baseDir, imageMap) {
      const imgs = doc.querySelectorAll("img[src]");
      imgs.forEach(img => {
        const src = img.getAttribute("src");
        if (!src) return;
        if (src.startsWith("data:") || src.startsWith("http:") || src.startsWith("https:")) return;
        const fullPath = joinPath(baseDir, src);
        const dataUrl = imageMap.get(fullPath);
        if (dataUrl) {
          img.setAttribute("src", dataUrl);
        }
      });
    }

    async function buildMergedHtml(zip, manifest, spineIds, opfDir, cssTexts, imageMap, titleFromMeta) {
      const parser = new DOMParser();
      const serializer = new XMLSerializer();
      let bodyContent = "";

      for (const id of spineIds) {
        const item = manifest.get(id);
        if (!item) continue;
        const fullPath = joinPath(opfDir, item.href);
        const baseDir = dirname(fullPath);
        const xhtml = await getTextFile(zip, fullPath);
        const doc = parser.parseFromString(xhtml, "application/xhtml+xml");

        const fileKey = item.href.replace(/\\/g, "/").split("/").pop().replace(/\.[^.]+$/, "");
        rewriteImages(doc, baseDir, imageMap);
        rewriteDocumentLinksAndIds(doc, fileKey);

        const body = doc.querySelector("body");
        if (body) {
          const inner = Array.from(body.childNodes).map(n => serializer.serializeToString(n)).join("");
          bodyContent += `\n<!-- From: ${item.href} -->\n<section data-epub-file="${item.href}">\n${inner}\n</section>\n`;
        }
      }

      const safeTitle = titleFromMeta || "EPUB Export";
      const cssCombined = cssTexts.join("\n");

      const finalHtml =
`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>${safeTitle}</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
body { margin: 0; padding: 1rem; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; max-width: 900px; margin-inline: auto; }
img { max-width: 100%; height: auto; }
a { color: #0645ad; }
${cssCombined}
</style>
</head>
<body>
${bodyContent}
</body>
</html>`;

      return finalHtml;
    }

    async function extractTitleFromOpf(zip, opfPath) {
      try {
        const opfText = await getTextFile(zip, opfPath);
        const parser = new DOMParser();
        const doc = parser.parseFromString(opfText, "application/xml");
        const titleEl = doc.querySelector("metadata > title, metadata > dc\\:title, dc\\:title");
        return titleEl ? titleEl.textContent.trim() : "";
      } catch {
        return "";
      }
    }

    function downloadHtml(content, baseName) {
      const blob = new Blob([content], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (baseName || "epub") + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    convertBtn.addEventListener("click", async () => {
      const file = epubInput.files && epubInput.files[0];
      if (!file) {
        setStatus("Please choose an EPUB file first.", true);
        return;
      }

      setStatus("Reading and converting EPUB… this may take a moment.");
      previewSection.hidden = true;
      previewContent.textContent = "";

      try {
        const zip = await loadEpubZip(file);
        const opfPath = await parseContainer(zip);
        const { manifest, spineIds, opfDir } = await parsePackage(zip, opfPath);
        const { cssTexts, imageMap } = await buildResourceMaps(zip, manifest, opfDir);
        const titleFromMeta = await extractTitleFromOpf(zip, opfPath);

        const finalHtml = await buildMergedHtml(
          zip,
          manifest,
          spineIds,
          opfDir,
          cssTexts,
          imageMap,
          titleFromMeta
        );

        // Show a short preview
        previewContent.textContent = finalHtml.slice(0, 4000) + (finalHtml.length > 4000 ? "\n…(truncated preview)…" : "");
        previewSection.hidden = false;

        downloadHtml(finalHtml, (titleFromMeta || file.name.replace(/\.epub$/i, "")));
        setStatus("Conversion complete. The HTML file should have downloaded.");
      } catch (err) {
        console.error(err);
        setStatus("Conversion failed: " + (err && err.message ? err.message : String(err)), true);
      }
    });
  </script>
</body>
</html>
